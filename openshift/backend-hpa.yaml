# Backend-api custom-metric autoscaling
#
# This deployment uses Red Hat's Custom Metrics Autoscaler (KEDA) which is already
# installed cluster-wide. KEDA queries the OpenShift thanos-querier with a service-
# account token and exposes the result as an external metric; the HPA it creates
# under the hood scales backend-api accordingly.
#
# The metric is gbaia_inflight_requests, exposed by backend.py at /metrics:
#   - Incremented on /ask, /ask/stream, /suggestions
#   - Excluded from /api/health and /metrics so the signal stays clean
#
# Pipeline:
#   backend.py /metrics  →  user-workload Prometheus (via ServiceMonitor)
#                       →  thanos-querier
#                       →  KEDA Prometheus scaler
#                       →  HPA on backend-api
#
# Apply:
#   oc apply -f openshift/backend-hpa.yaml
#
---
# Headless service so user-workload Prometheus gets a per-pod scrape target
apiVersion: v1
kind: Service
metadata:
  name: backend-api-metrics
  namespace: gbaia
  labels:
    app: backend-api
    monitoring: prometheus
spec:
  selector:
    app: backend-api
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000
      protocol: TCP
  clusterIP: None
---
# User-workload Prometheus picks this up automatically when
# enableUserWorkload: true (already configured in cluster-monitoring-config)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-api
  namespace: gbaia
  labels:
    app: backend-api
spec:
  selector:
    matchLabels:
      app: backend-api
      monitoring: prometheus
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
# ServiceAccount that KEDA uses to query thanos-querier.
# Needs cluster-monitoring-view to read user-workload metrics.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thanos-query-sa
  namespace: gbaia
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gbaia-thanos-query-sa-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: thanos-query-sa
    namespace: gbaia
---
# A long-lived token for the SA. KEDA picks this up via TriggerAuthentication.
apiVersion: v1
kind: Secret
metadata:
  name: thanos-query-sa-token
  namespace: gbaia
  annotations:
    kubernetes.io/service-account.name: thanos-query-sa
type: kubernetes.io/service-account-token
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: thanos-auth
  namespace: gbaia
spec:
  secretTargetRef:
    - parameter: bearerToken
      name: thanos-query-sa-token
      key: token
    - parameter: ca
      name: thanos-query-sa-token
      key: ca.crt
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: backend-api
  namespace: gbaia
spec:
  scaleTargetRef:
    name: backend-api
  minReplicaCount: 2
  maxReplicaCount: 8
  pollingInterval: 15      # query Prometheus every 15s
  cooldownPeriod: 300      # wait 5 min of idle before scaling down
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Pods
              value: 2
              periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
  triggers:
    # Primary: in-flight LLM/MCP requests per pod
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: https://thanos-querier.openshift-monitoring.svc.cluster.local:9092
        # avg(...) gives us a single number; KEDA divides by replica count to drive AverageValue
        query: sum(gbaia_inflight_requests{namespace="gbaia"})
        threshold: "4"
        authModes: bearer
        unsafeSsl: "true"
      authenticationRef:
        name: thanos-auth
