# Backend-api custom-metric HPA
#
# Scales backend-api based on the average number of in-flight LLM/MCP requests
# per pod. The metric is exposed by backend.py at /metrics as `gbaia_inflight_requests`
# (see the _track_inflight middleware and the /metrics endpoint).
#
# Prerequisites in the cluster:
#   1. Prometheus that scrapes /metrics on the backend-api pods. The ServiceMonitor
#      below works if the OpenShift user-workload monitoring stack (or the Prometheus
#      Operator) is enabled in the gbaia namespace.
#   2. prometheus-adapter (or KEDA + the `prometheus` scaler) installed and configured
#      to expose `gbaia_inflight_requests` through the custom.metrics.k8s.io API.
#      See the ConfigMap snippet at the bottom.
#
# Apply:
#   oc apply -f openshift/backend-hpa.yaml
#
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api-metrics
  namespace: gbaia
  labels:
    app: backend-api
    monitoring: prometheus
spec:
  selector:
    app: backend-api
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000
      protocol: TCP
  clusterIP: None        # headless - we want per-pod scrape targets
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-api
  namespace: gbaia
  labels:
    app: backend-api
spec:
  selector:
    matchLabels:
      app: backend-api
      monitoring: prometheus
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-api
  namespace: gbaia
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    # Primary signal: in-flight LLM/MCP requests per pod.
    # Target: 4 concurrent requests per pod. With p95 ~ 15-25 s per /ask, that
    # gives each user a sub-30s response under expected load.
    - type: Pods
      pods:
        metric:
          name: gbaia_inflight_requests
        target:
          type: AverageValue
          averageValue: "4"
    # Backstop on memory in case of an LLM payload spike that doesn't show up
    # immediately in the in-flight count (e.g. one very large synthesis).
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300       # avoid flapping after burst
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
---
