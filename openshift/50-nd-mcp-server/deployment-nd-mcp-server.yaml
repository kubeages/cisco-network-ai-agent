apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nd-mcp-server
    app.kubernetes.io/part-of: gbaia
    component: mcp-server
  name: gbaia-nd-mcp-server
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"gbaia-nd-mcp-server:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"mcp-server\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gbaia-nd-mcp-server
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: gbaia-nd-mcp-server
        component: mcp-server
    spec:
      containers:
      - command:
        - bash
        - scripts/start-web-api.sh
        env:
        - name: SERVER_IP
          value: 0.0.0.0
        - name: SERVER_PORT
          value: '7443'
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              key: ENCRYPTION_KEY
              name: gbaia-nd-mcp-secrets
        - name: POSTGRES_HOST
          value: gbaia-nd-mcp-postgres
        - name: POSTGRES_PORT
          value: '5432'
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: POSTGRES_USER
              name: gbaia-nd-mcp-secrets
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: gbaia-nd-mcp-secrets
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              key: POSTGRES_DB
              name: gbaia-nd-mcp-secrets
        - name: ND_URL
          valueFrom:
            secretKeyRef:
              key: ND_URL
              name: gbaia-nd-mcp-secrets
        - name: ND_USER
          valueFrom:
            secretKeyRef:
              key: ND_USER
              name: gbaia-nd-mcp-secrets
        - name: ND_PASSWORD
          valueFrom:
            secretKeyRef:
              key: ND_PASSWORD
              name: gbaia-nd-mcp-secrets
        - name: MCP_API_TOKEN
          valueFrom:
            secretKeyRef:
              key: MCP_API_TOKEN
              name: gbaia-nd-mcp-secrets
              optional: true
        - name: WEB_API_PORT
          value: '7443'
        - name: BACKEND_API_URL
          value: http://gbaia-nd-mcp-server:8001
        - name: SSL_ENABLED
          value: 'false'
        - name: INTERNAL_HTTP_PORT
          value: '8000'
        - name: NEXUS_CLUSTER_NAME
          value: OB_LAB
        - name: NEXUS_CLUSTER_URL
          valueFrom:
            secretKeyRef:
              key: ND_URL
              name: gbaia-nd-mcp-secrets
        - name: NEXUS_USERNAME
          valueFrom:
            secretKeyRef:
              key: ND_USER
              name: gbaia-nd-mcp-secrets
        - name: NEXUS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: ND_PASSWORD
              name: gbaia-nd-mcp-secrets
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: DATABASE_URL
              name: gbaia-nd-mcp-secrets
        image: gbaia-nd-mcp-server:latest
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/health
            port: 7443
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: mcp-server
        ports:
        - containerPort: 7443
          name: https
          protocol: TCP
        - containerPort: 8443
          name: mcp-sse
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/health
            port: 7443
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - sh
        - -c
        - until nc -z gbaia-nd-mcp-postgres 5432; do echo "Waiting for PostgreSQL..."; sleep 2; done; echo "PostgreSQL is ready!"
        image: mirror.gcr.io/library/busybox:1.36
        imagePullPolicy: IfNotPresent
        name: wait-for-postgres
        resources: {}
      restartPolicy: Always
      securityContext: {}
      terminationGracePeriodSeconds: 30
