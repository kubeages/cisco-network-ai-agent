apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nd-mcp-postgres
    app.kubernetes.io/part-of: gbaia
    component: database
  name: gbaia-nd-mcp-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gbaia-nd-mcp-postgres
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: gbaia-nd-mcp-postgres
        component: database
    spec:
      containers:
      - env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: POSTGRES_USER
              name: gbaia-nd-mcp-secrets
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: gbaia-nd-mcp-secrets
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              key: POSTGRES_DB
              name: gbaia-nd-mcp-secrets
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        image: mirror.gcr.io/library/postgres:15-alpine
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - ndmcp
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: postgres
        ports:
        - containerPort: 5432
          name: postgres
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - ndmcp
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-storage
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: gbaia-nd-mcp-postgres-pvc
