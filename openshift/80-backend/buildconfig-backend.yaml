apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  labels:
    app: gbaia-backend
    app.kubernetes.io/part-of: gbaia
  name: gbaia-backend
spec:
  failedBuildsHistoryLimit: 5
  output:
    to:
      kind: ImageStreamTag
      name: gbaia-backend:latest
  runPolicy: Serial
  source:
    contextDir: backend
    git:
      ref: main
      uri: https://github.com/kubeages/cisco-network-ai-agent
    type: Git
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
      # Override the placeholder FROM in backend/Dockerfile with the
      # cluster-local base image that has all the pip deps pre-installed.
      # This turns app rebuilds from ~15-20 min into ~30 s.
      from:
        kind: ImageStreamTag
        name: gbaia-backend-base:latest
  successfulBuildsHistoryLimit: 5
  triggers:
  - type: ConfigChange
  - github:
      secret: github-webhook-secret
    type: GitHub
  # When the base image gets rebuilt (e.g. requirements.txt changed),
  # rebuild the app image on top of it automatically.
  - type: ImageChange
    imageChange:
      from:
        kind: ImageStreamTag
        name: gbaia-backend-base:latest
