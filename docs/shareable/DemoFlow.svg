<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>gbaia — Demo Flow: journey of a single user question</title>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#546e7a"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
    <style>
      .box       { fill:#fff; stroke:#1976d2; stroke-width:2; rx:12; ry:12; }
      .box-user  { fill:#e3f2fd; stroke:#1976d2; stroke-width:2; rx:12; ry:12; }
      .box-app   { fill:#fff; stroke:#0b3d91; stroke-width:2; rx:12; ry:12; }
      .box-defense{fill:#fff8e1; stroke:#f57c00; stroke-width:2; rx:12; ry:12; }
      .box-source{ fill:#e0f7fa; stroke:#00838f; stroke-width:2; rx:12; ry:12; }
      .box-llm   { fill:#f3e5f5; stroke:#6a1b9a; stroke-width:2; rx:12; ry:12; }
      .box-block { fill:#ffebee; stroke:#c62828; stroke-width:2; rx:12; ry:12; }
      .title     { font-size:16px; font-weight:600; fill:#263238; }
      .subtitle  { font-size:12px; fill:#546e7a; }
      .link      { stroke:#546e7a; stroke-width:2; fill:none; }
      .link-ok   { stroke:#2e7d32; stroke-width:2; fill:none; stroke-dasharray:0; }
      .link-block{ stroke:#c62828; stroke-width:2; fill:none; stroke-dasharray:6 4; }
      .lbl       { font-size:11px; fill:#37474f; font-weight:600; }
      .step      { font-size:11px; font-weight:700; fill:#0b3d91; }
      .header    { font-size:22px; font-weight:700; fill:#0b3d91; }
      .caption   { font-size:12px; fill:#546e7a; font-style:italic; }
    </style>
  </defs>

  <!-- Header -->
  <text x="30" y="40" class="header">gbaia — Demo Flow</text>
  <text x="30" y="62" class="caption">How one user question travels through the stack</text>

  <!-- Row 1: User → Frontend → Backend -->
  <rect x="30"  y="100" width="180" height="70" class="box-user"/>
  <text x="120" y="128" text-anchor="middle" class="title">User</text>
  <text x="120" y="150" text-anchor="middle" class="subtitle">types question in chat</text>

  <line x1="210" y1="135" x2="270" y2="135" class="link" marker-end="url(#arr)"/>

  <rect x="270" y="100" width="180" height="70" class="box-app"/>
  <text x="360" y="128" text-anchor="middle" class="title">Frontend</text>
  <text x="360" y="150" text-anchor="middle" class="subtitle">Gradio UI, POST /ask</text>

  <line x1="450" y1="135" x2="510" y2="135" class="link" marker-end="url(#arr)"/>

  <rect x="510" y="100" width="180" height="70" class="box-app"/>
  <text x="600" y="128" text-anchor="middle" class="title">Backend</text>
  <text x="600" y="150" text-anchor="middle" class="subtitle">FastAPI, 2 replicas</text>

  <line x1="690" y1="135" x2="750" y2="135" class="link" marker-end="url(#arr)"/>

  <!-- Step 1: AI Defense prompt inspection -->
  <rect x="750" y="90" width="240" height="90" class="box-defense"/>
  <text x="870" y="120" text-anchor="middle" class="title">① AI Defense — Prompt</text>
  <text x="870" y="140" text-anchor="middle" class="subtitle">POST /api/v1/inspect/chat</text>
  <text x="870" y="158" text-anchor="middle" class="subtitle">Console-managed policy</text>

  <!-- Block branch (up-right) -->
  <path d="M990,110 Q1100,110 1130,180" class="link-block" marker-end="url(#arr-red)"/>
  <rect x="1130" y="180" width="240" height="70" class="box-block"/>
  <text x="1250" y="208" text-anchor="middle" class="title">Blocked</text>
  <text x="1250" y="230" text-anchor="middle" class="subtitle">safe refusal returned to user</text>

  <!-- Allow branch (down) -->
  <line x1="870" y1="180" x2="870" y2="240" class="link-ok" marker-end="url(#arr-green)"/>
  <text x="885" y="215" class="step">allow ↓</text>

  <!-- Step 2: Router -->
  <rect x="750" y="240" width="240" height="80" class="box-app"/>
  <text x="870" y="270" text-anchor="middle" class="title">② Router</text>
  <text x="870" y="290" text-anchor="middle" class="subtitle">classify_query_intent()</text>
  <text x="870" y="308" text-anchor="middle" class="subtitle">entity lookup + keyword fallback</text>

  <!-- Fan-out to 4 sources -->
  <path d="M810,320 Q810,380 210,380" class="link" marker-end="url(#arr)"/>
  <path d="M840,320 Q840,380 470,380" class="link" marker-end="url(#arr)"/>
  <path d="M900,320 Q900,380 730,380" class="link" marker-end="url(#arr)"/>
  <path d="M930,320 Q930,380 990,380" class="link" marker-end="url(#arr)"/>

  <!-- Step 3: Four possible sources -->
  <rect x="30"  y="380" width="180" height="80" class="box-source"/>
  <text x="120" y="410" text-anchor="middle" class="title">Neo4j</text>
  <text x="120" y="430" text-anchor="middle" class="subtitle">graph query</text>
  <text x="120" y="448" text-anchor="middle" class="subtitle">topology / relations</text>

  <rect x="290" y="380" width="180" height="80" class="box-source"/>
  <text x="380" y="410" text-anchor="middle" class="title">ND-MCP</text>
  <text x="380" y="430" text-anchor="middle" class="subtitle">live ND tool call</text>
  <text x="380" y="448" text-anchor="middle" class="subtitle">anomalies, metrics</text>

  <rect x="550" y="380" width="180" height="80" class="box-source"/>
  <text x="640" y="410" text-anchor="middle" class="title">Intersight-MCP</text>
  <text x="640" y="430" text-anchor="middle" class="subtitle">live IS tool call</text>
  <text x="640" y="448" text-anchor="middle" class="subtitle">servers, chassis</text>

  <rect x="810" y="380" width="180" height="80" class="box-source"/>
  <text x="900" y="410" text-anchor="middle" class="title">Hybrid</text>
  <text x="900" y="430" text-anchor="middle" class="subtitle">graph + live</text>
  <text x="900" y="448" text-anchor="middle" class="subtitle">multi-fabric queries</text>

  <!-- Merge to LLM -->
  <path d="M120,460 Q120,530 500,530" class="link" marker-end="url(#arr)"/>
  <path d="M380,460 Q380,510 500,530" class="link" marker-end="url(#arr)"/>
  <path d="M640,460 Q640,510 500,530" class="link" marker-end="url(#arr)"/>
  <path d="M900,460 Q900,510 620,530" class="link" marker-end="url(#arr)"/>

  <!-- Step 4: LLM -->
  <rect x="500" y="530" width="260" height="90" class="box-llm"/>
  <text x="630" y="562" text-anchor="middle" class="title">③ LLM synthesis</text>
  <text x="630" y="582" text-anchor="middle" class="subtitle">Qwen 3.6 27B on vLLM</text>
  <text x="630" y="600" text-anchor="middle" class="subtitle">context + question → answer</text>

  <line x1="760" y1="575" x2="820" y2="575" class="link" marker-end="url(#arr)"/>

  <!-- Step 5: AI Defense response inspection -->
  <rect x="820" y="530" width="260" height="90" class="box-defense"/>
  <text x="950" y="562" text-anchor="middle" class="title">④ AI Defense — Response</text>
  <text x="950" y="582" text-anchor="middle" class="subtitle">same endpoint, response role</text>
  <text x="950" y="600" text-anchor="middle" class="subtitle">PII / unsafe output detection</text>

  <!-- Block branch for response -->
  <path d="M1080,555 Q1200,555 1250,600" class="link-block" marker-end="url(#arr-red)"/>
  <text x="1150" y="548" class="step">block</text>

  <!-- Allow → answer -->
  <path d="M950,620 Q950,700 620,700" class="link-ok" marker-end="url(#arr-green)"/>
  <text x="960" y="655" class="step">allow</text>

  <!-- Step 6: Answer -->
  <rect x="440" y="700" width="240" height="80" class="box-user"/>
  <text x="560" y="730" text-anchor="middle" class="title">Answer displayed</text>
  <text x="560" y="750" text-anchor="middle" class="subtitle">markdown formatted, with</text>
  <text x="560" y="768" text-anchor="middle" class="subtitle">data-source badge(s)</text>

  <!-- Back to user -->
  <path d="M440,740 Q220,740 120,170" class="link" marker-end="url(#arr)"/>

  <!-- Legend -->
  <rect x="1130" y="700" width="240" height="80" fill="#fff" stroke="#cfd8dc" stroke-width="1" rx="8" ry="8"/>
  <text x="1140" y="720" class="lbl">Legend</text>
  <line x1="1140" y1="734" x2="1170" y2="734" class="link-ok"/>
  <text x="1178" y="738" class="subtitle">safe → next stage</text>
  <line x1="1140" y1="750" x2="1170" y2="750" class="link-block"/>
  <text x="1178" y="754" class="subtitle">blocked by AI Defense</text>
  <line x1="1140" y1="766" x2="1170" y2="766" class="link"/>
  <text x="1178" y="770" class="subtitle">plain data flow</text>

  <!-- Footer -->
  <text x="30" y="800" class="caption">Typical end-to-end latency: 1–3 s for graph, 3–7 s for MCP tool calls, &lt; 1 s to reject on prompt injection.</text>
</svg>
